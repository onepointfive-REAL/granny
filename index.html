(function() {
    // 1. Intercept the XMLHttpRequest API (Unity's asset loader)
    const OriginalXHR = window.XMLHttpRequest;
    
    function PatchedXHR() {
        const xhr = new OriginalXHR();
        const originalOpen = xhr.open;

        xhr.open = function(method, url, async, user, password) {
            // If Unity tries to fetch from our dummy secure domain, redirect it locally!
            if (typeof url === 'string' && url.includes('https://fake-secure-local/')) {
                url = url.replace('https://fake-secure-local/', './');
            }
            return originalOpen.apply(this, [method, url, async, user, password]);
        };
        return xhr;
    }
    window.XMLHttpRequest = PatchedXHR;
    Object.assign(window.XMLHttpRequest, OriginalXHR);

    // 2. Intercept the modern Fetch API (for newer Unity configurations)
    const originalFetch = window.fetch;
    window.fetch = function(input, init) {
        if (typeof input === 'string' && input.includes('https://fake-secure-local/')) {
            input = input.replace('https://fake-secure-local/', './');
        } else if (input instanceof Request && input.url.includes('https://fake-secure-local/')) {
            const localUrl = input.url.replace('https://fake-secure-local/', './');
            input = new Request(localUrl, input);
        }
        return originalFetch(input, init);
    };
})();
</script>

<html lang="en-us">
<head>
    <title>Granny HTML5</title>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <link rel="stylesheet" href="./style.css">

</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" style="position: absolute; width: 100%; height: 100%"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo">
            </div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
            <br>
            <div id="loading-text">Loading game assets...</div>
        </div>
        <div id="unity-warning"></div>
    </div>
    <script>
        const message="Code reworked by onepointfive-REAL on github<br><br>"
        document.querySelector("#loading-text").innerHTML = `${message}Loading game assets 0%`;
        async function mergeUnityWebFiles(baseUrl, filePrefix, totalParts, extension) {
            const partUrls = [];
            for (let i = 1; i <= totalParts; i++) {
                partUrls.push(`${baseUrl}/${filePrefix}_part${i}.${extension}`);
            }

            const buffers = [];
            for (let i = 0; i < totalParts; i++) {
                const response = await fetch(partUrls[i]);
                if (!response.ok) {
                    throw new Error(`Failed to load part: ${partUrls[i]}`);
                }
                const buffer = await response.arrayBuffer();
                buffers.push(buffer);

                let progress = ((i + 1) / totalParts) * 25;
                if (extension === "wasm") progress += 25;
                let progressload = ((i + 1) / totalParts) * 50;
                if (extension === "wasm") progressload += 50;
                document.querySelector("#unity-progress-bar-full").style.width = `${progress}%`;
                document.querySelector("#loading-text").innerHTML = `${message}Loading game assets ${progressload}%`;
            }

            const totalLength = buffers.reduce((acc, buffer) => acc + buffer.byteLength, 0);
            const combinedBuffer = new Uint8Array(totalLength);
            let offset = 0;

            buffers.forEach((buffer) => {
                combinedBuffer.set(new Uint8Array(buffer), offset);
                offset += buffer.byteLength;
            });

            return combinedBuffer;
        }

        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var warningBanner = document.querySelector("#unity-warning");

        let myGameInstance = null;
        let isAdShown = false;
        
        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                if (type == 'message') div.style = 'color: white; background: green; padding: 10px;';
                setTimeout(function() {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }
        var buildUrl = ".";
        var loaderUrl = buildUrl + "/Granny.loader.js";

        async function initializeGame() {
            try {
                const dataBuffer = await mergeUnityWebFiles(buildUrl, "Granny", 2, "data");
                const wasmBuffer = await mergeUnityWebFiles(buildUrl, "Granny", 2, "wasm");

                const dataBlobUrl = URL.createObjectURL(new Blob([dataBuffer], { type: "application/octet-stream" }));
                const wasmBlobUrl = URL.createObjectURL(new Blob([wasmBuffer], { type: "application/octet-stream" }));

                var config = {
                    dataUrl: dataBlobUrl,
                    frameworkUrl: buildUrl + "/Granny.framework.js",
                    codeUrl: wasmBlobUrl,
                    streamingAssetsUrl: "https://fake-secure-local/StreamingAssets",
                    companyName: "onepointfive-REAL",
                    productName: "Granny",
                    productVersion: "1.0",
                    showBanner: unityShowBanner,
                };

                var script = document.createElement("script");
                script.src = loaderUrl;
                script.onload = () => {
                    createUnityInstance(canvas, config, (progress) => {
                        progressBarFull.style.width = (50 + (progress * 50)) + "%";
                        let progressload = Math.floor(progress * 100);
                        document.querySelector("#loading-text").innerHTML = `${message}Loading unity ${progressload}%`;
                    }).then((unityInstance) => {
                        myGameInstance = unityInstance;
                        loadingBar.style.display = "none";
                    }).catch((message) => {
                        alert(message);
                    });
                };

                document.body.appendChild(script);
            } catch (error) {
                console.error("Game initialization failed:", error);
            }
        }

        initializeGame();
    </script>
</body>
</html>
